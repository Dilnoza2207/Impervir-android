name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: impervir-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish the APK as the "latest" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk impervir.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest impervir.apk --title "Impervir (latest build)" --notes "Debug build of ${GITHUB_SHA::7}. Open impervir.apk on your Android phone to install." --target "$GITHUB_SHA"
